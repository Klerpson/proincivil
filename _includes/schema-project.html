<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CreativeWork",
  "@id": "{{ page.url | absolute_url }}#project",
  "name": {{ page.h1 | strip_html | jsonify }},
  "description": {{ page.description | strip_html | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "creator": { "@id": "{{ site.url }}/#organization" },
  "locationCreated": { "@type": "Place", "name": {{ page.ficha.ubicacion | jsonify }} },
  {%- assign _anio = page.ficha.anio | append: "" %}
  {% if _anio != "" and _anio != "PENDIENTE" and _anio.size == 4 %}"dateCreated": "{{ _anio }}",{% endif %}
  "keywords": {{ page.ficha.servicio | jsonify }},
  "inLanguage": "es-CO"
}
</script>
