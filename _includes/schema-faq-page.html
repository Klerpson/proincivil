{%- if page.faqs -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "{{ page.url | absolute_url }}#faq",
  "inLanguage": "es-CO",
  "mainEntity": [
    {%- for faq in page.faqs %}
    { "@type": "Question", "name": {{ faq.question | strip_html | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ faq.answer | markdownify | strip_html | strip_newlines | jsonify }} } }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
{%- endif -%}
