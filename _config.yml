# Configuración principal — PROINCIVIL S.A.S.
# Sitio estático Jekyll alojado en GitHub Pages (solo plugins de la lista blanca).
#
# ── MODO VISTA PREVIA ────────────────────────────────────────────────────────
# Mientras el cliente no apruebe el contenido y no exista el dominio, el sitio vive en
# GitHub Pages con `vista_previa: true`: todas las páginas salen con noindex y robots.txt
# bloquea el rastreo. AL PASAR A PRODUCCIÓN: poner `vista_previa: false`, cambiar `url` a
# https://www.proincivil.com, dejar `baseurl` vacío y restaurar el archivo CNAME.
vista_previa: true
url: "https://klerpson.github.io"
baseurl: "/proincivil"

# Secciones que se publican hoy. Las demás quedan escritas en el repositorio pero fuera del
# sitio (contenido de la fase SEO). La navegación, el pie y los CTA se filtran con esta lista:
# basta añadir una sección aquí y volver a compilar para que aparezca en todo el sitio.
secciones_publicadas: ["servicios", "proyectos", "blog", "nosotros", "como-cotizar", "contacto", "politica-de-datos"]
name: PROINCIVIL
title: PROINCIVIL · Seguridad estructural
description: "Ingeniería estructural sismorresistente, evaluación, geotecnia e interventoría en Envigado, Antioquia."
author: PROINCIVIL S.A.S.
# Repositorio de GitHub Pages (usuario/repo). Hoy vive en la cuenta del contratista; al entregar el
# proyecto se transfiere a la cuenta de PROINCIVIL y se actualiza este valor.
repository: Klerpson/proincivil
lang: es-CO
# Sin `timezone`: en Windows exige la gema tzinfo-data (no disponible offline) y GitHub Pages compila en UTC.

# Verificación de Search Console (solo el valor "content"). Vacío = no se imprime.
google_site_verification: ""
# GA4 (G-XXXXXXX). Vacío = no se carga analítica. Solo se inyecta con JEKYLL_ENV=production.
ga4_id: ""

# Formulario: endpoint de Formspree/Web3Forms/Getform. GitHub Pages no procesa formularios.
# Vacío = el formulario muestra el aviso y deriva a WhatsApp.
form_endpoint: ""

site_meta:
  title: "PROINCIVIL · Ingeniería estructural sismorresistente en Envigado, Antioquia"
  description: "Firma de ingeniería estructural en Envigado. Diseño sismorresistente NSR-10, evaluación y reforzamiento, geotecnia, interventoría y acompañamiento ante curadurías. No ejecutamos obra: consultoría independiente con BIM."

