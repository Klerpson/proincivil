# ─── Jekyll ───
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
encoding: utf-8
strict_front_matter: true
future: true
permalink: /:slug/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: feed.xml
  posts_limit: 20

include: [".well-known"]
exclude:
  - "*.tmp"
  - "*.bak"
  - "*.pyc"
  - "__pycache__"
  - "Python"
  - "Gemfile*"
  - "README.md"
  - "AGENTS.md"
  - "node_modules"
  - "package*.json"
  - ".jekyll-cache"
  - ".claude"
  - ".remember"
  - "_plans"
  - "_scripts"
  - "_site"
  - "tmp"
  - "vendor"

compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  endings: [li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  ignore:
    envs: []
  blanklines: false
  profile: false
  startings: []

# ─── Colecciones ───
collections:
  servicios:
    output: true
    permalink: /servicios/:slug/
  proyectos:
    output: true
    permalink: /proyectos/:slug/
  # ── Retenidas para la fase SEO (escritas y versionadas, fuera del sitio publicado) ──
  cuanto-cuesta:
    output: false
    permalink: /cuanto-cuesta/:slug/
  edificaciones:
    output: false
    permalink: /edificaciones/:slug/
  zonas:
    output: false
    permalink: /zonas/:slug/
  normativa:
    output: false
    permalink: /normativa/:path/
  glosario:
    output: false
    permalink: /glosario/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      lang: "es"
      image: "/img/og-proincivil.jpg"
  - scope:
      path: ""
      type: "servicios"
    values:
      layout: "service"
      schemaType: "Service"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "cuanto-cuesta"
    values:
      layout: "service"
      schemaType: "Service"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "edificaciones"
    values:
      layout: "service"
      schemaType: "Service"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "zonas"
    values:
      layout: "service"
      schemaType: "Service"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "normativa"
    values:
      layout: "article"
      schemaType: "Article"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "glosario"
    values:
      layout: "article"
      schemaType: "Article"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "proyectos"
    values:
      layout: "project"
      schemaType: "Project"
      breadcrumb_enabled: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      schemaType: "Article"
      permalink: /blog/:slug/
      author: "camilo-tamayo"
