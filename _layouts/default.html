---
layout: compress
---
<!DOCTYPE html>
<html lang="es-CO">
  <head>
    {% include head.html %}
  </head>
  <body data-layout="{{ page.layout | default: 'page' }}">
    {%- if jekyll.environment == "production" and site.gtm_id != "" %}
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.gtm_id }}" height="0" width="0" hidden title="Google Tag Manager"></iframe></noscript>
    {%- endif %}
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    {% include nav.html %}
    <main id="contenido">
      {% include header.html %}
      {{ content }}
    </main>
    {% include footer.html %}
    {% include sticky-cta-mobile.html %}
    <script defer src="{{ '/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script defer src="{{ '/js/motion.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
